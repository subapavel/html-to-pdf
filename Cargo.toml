[workspace]
resolver = "3"
members = [
    "crates/htmltopdf",
    "crates/htmltopdf-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/subapavel/html-to-pdf"

[workspace.dependencies]
# Core engine: Blitz (Stylo + Taffy + Parley) + Krilla, glued by fulgur.
# Pinned to an exact minor — fulgur is 0.x and each minor may break the API.
fulgur = "=0.40.0"

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
log = "0.4"
# Same versions that are already in the tree via Stylo / Parley; no new packages.
cssparser = "0.35"
ttf-parser = "0.25"
env_logger = "0.11"

# Release builds are what the CLI and the cloud agent use for rendering;
# optimise for speed, keep debug info out of the binary.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# Stylo/Blitz are slow in unoptimised builds; render fixtures in tests with
# optimised dependencies even in `dev` so `cargo test` stays usable.
[profile.dev.package."*"]
opt-level = 2

# Fixes carried until they are released upstream (docs/upstream.md). Each fork branch is the published
# crate's exact source commit plus our fix; versions must stay equal to the ones in Cargo.lock.
[patch.crates-io]
fulgur = { git = "https://github.com/subapavel/fulgur", branch = "htmltopdf/srgb-colours" }
blitz-dom = { git = "https://github.com/subapavel/blitz", branch = "htmltopdf/blitz-dom-0.2.4" }
taffy = { git = "https://github.com/subapavel/taffy", branch = "htmltopdf/minimum-contribution" }
